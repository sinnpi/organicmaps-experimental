name: Experimental APK

on:
  push:
    tags:
      - 'experimental-*'

permissions:
  contents: read

concurrency:
  group: experimental-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish experimental ARM64 APK
    if: github.repository == 'sinnpi/organicmaps-experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which sdkmanager no longer finds.
          packages: platform-tools

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build experimental APK
        working-directory: android
        run: ./gradlew :app:assembleGoogleExperimental -Parm64 -Pnjobs=2 --console=plain

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          output = pathlib.Path('android/app/build/outputs/apk/google/experimental')
          metadata = json.loads((output / 'output-metadata.json').read_text())
          assert metadata['applicationId'] == 'app.organicmaps.experimental'
          assert len(metadata['elements']) == 1
          apk = output / metadata['elements'][0]['outputFile']
          assert apk.name.endswith('-google-experimental.apk')
          shutil.copy2(apk, pathlib.Path('release-files') / apk.name)
          PY
          (cd release-files && sha256sum *.apk > SHA256SUMS)
          cat > release-notes.md <<'EOF'
          Experimental Organic Maps for ARM64 Android devices.

          Install the APK below; it coexists with the official Organic Maps app.
          This is the release-like experimental variant, not debug or profiling.
          It uses the public test-signing key and is not a secure production release.
          Back up bookmarks and tracks before testing. Updates are installed manually.

          Only the experimental APK and its SHA-256 checksum are distributed here.
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --prerelease \
            --title "Experimental Organic Maps — $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            release-files/*.apk release-files/SHA256SUMS
